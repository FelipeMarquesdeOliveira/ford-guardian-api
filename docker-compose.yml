# API + Prometheus + Grafana. Uso: cp .env.example .env (preencha os segredos) && docker compose up -d --build
services:
  api:
    build: .
    container_name: ford-guardian-api
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ford-guardian-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: ford-guardian-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-troque-esta-senha}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
