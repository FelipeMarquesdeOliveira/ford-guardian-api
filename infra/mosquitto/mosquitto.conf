# Broker MQTT do Ford Guardian (mock de infraestrutura IoT) - somente TLS, sem acesso anônimo.
per_listener_settings true

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
tls_version tlsv1.2
# Autenticação mútua: o dispositivo apresenta certificado assinado pela CA da Ford
require_certificate true
use_identity_as_username false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Sem listener 1883 (texto claro) exposto
log_type error
log_type warning
log_type notice
connection_messages true
